name: "AI-Driven DevSecOps Framework"
description: "Reusable DevSecOps action for C/C++ static analysis"

inputs:
  scan-path:
    description: "Path to scan in the target repository"
    required: false
    default: "."
  ml1-high-threshold:
    description: "ML1 HIGH risk threshold (0-100)"
    required: false
    default: "70"
  ml1-medium-threshold:
    description: "ML1 MEDIUM risk threshold (0-100)"
    required: false
    default: "40"
  ml1-review-confidence-threshold:
    description: "ML1 confidence threshold (0-1) below which risk_level becomes REVIEW_REQUIRED"
    required: false
    default: "0.2"
  ml3-minimum-history:
    description: "Minimum trusted historical ML3 rows required before initial model training"
    required: false
    default: "30"
  ml3-retraining-interval:
    description: "Additional trusted historical rows between ML3 retraining cycles"
    required: false
    default: "20"
  ml3-contamination:
    description: "IsolationForest contamination used for ML3 training and inference"
    required: false
    default: "0.1"
  ml3-state-branch:
    description: "Branch that stores persistent repository-specific ML3 state"
    required: false
    default: "devsecops-state"

runs:
  using: "composite"

  steps:
    - name: Install SAST tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck clang clang-tools python3-pip

    - name: Install Python ML dependencies
      shell: bash
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Create report folders
      shell: bash
      run: |
        mkdir -p reports
        mkdir -p reports/commit_risk
        mkdir -p reports/clang-report
        mkdir -p reports/alert_prioritizer/cppcheck
        mkdir -p reports/alert_prioritizer/clang
        mkdir -p reports/anomaly_detection
        mkdir -p reports/final_decision
        mkdir -p .devsecops/anomaly_detection/models

    - name: Run Cppcheck static analysis
      shell: bash
      run: |
        cppcheck \
          --enable=all \
          --inconclusive \
          --xml \
          -I include \
          -i.devsecops \
          -ireports \
          -i.git \
          "${{ inputs.scan-path }}" \
          2> reports/cppcheck-report.xml

    - name: Run Clang Static Analyzer
      shell: bash
      run: |
        CLANG_STATUS_FILE="reports/clang-report/scan-status.txt"

        C_FILES=$(find "${{ inputs.scan-path }}" \
          -path "*/.devsecops" -prune -o \
          -path "*/reports" -prune -o \
          -path "*/.git" -prune -o \
          -name "*.c" -print)

        CPP_FILES=$(find "${{ inputs.scan-path }}" \
          -path "*/.devsecops" -prune -o \
          -path "*/reports" -prune -o \
          -path "*/.git" -prune -o \
          \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" \) -print)

        echo "C files found for Clang analysis:"
        echo "$C_FILES"

        echo "C++ files found for Clang analysis:"
        echo "$CPP_FILES"

        if [ -z "$C_FILES" ] && [ -z "$CPP_FILES" ]; then
          echo "No C/C++ files found for Clang analysis." | tee reports/clang-output.txt
          echo "SCAN_COMPLETED_NO_SOURCE" > "$CLANG_STATUS_FILE"
        else
          : > reports/clang-output.txt
          findings_detected=0

          if [ -n "$C_FILES" ]; then
            echo "Running Clang analyzer for C files..." | tee -a reports/clang-output.txt
            set +e
            scan-build \
              --status-bugs \
              -o reports/clang-report \
              clang \
              -std=gnu89 \
              -fsyntax-only \
              $C_FILES \
              >> reports/clang-output.txt 2>&1
            c_exit=$?
            set -e

            if [ "$c_exit" -eq 1 ]; then
              findings_detected=1
              echo "Clang analyzer reported findings for C files." | tee -a reports/clang-output.txt
            elif [ "$c_exit" -ne 0 ]; then
              echo "SCAN_FAILED" > "$CLANG_STATUS_FILE"
              echo "Clang analyzer execution failed for C files with exit code $c_exit." | tee -a reports/clang-output.txt
              exit "$c_exit"
            fi
          fi

          if [ -n "$CPP_FILES" ]; then
            echo "Running Clang analyzer for C++ files..." | tee -a reports/clang-output.txt
            set +e
            scan-build \
              --status-bugs \
              -o reports/clang-report \
              clang++ \
              -std=c++11 \
              -fsyntax-only \
              $CPP_FILES \
              >> reports/clang-output.txt 2>&1
            cpp_exit=$?
            set -e

            if [ "$cpp_exit" -eq 1 ]; then
              findings_detected=1
              echo "Clang analyzer reported findings for C++ files." | tee -a reports/clang-output.txt
            elif [ "$cpp_exit" -ne 0 ]; then
              echo "SCAN_FAILED" > "$CLANG_STATUS_FILE"
              echo "Clang analyzer execution failed for C++ files with exit code $cpp_exit." | tee -a reports/clang-output.txt
              exit "$cpp_exit"
            fi
          fi

          if [ "$findings_detected" -eq 1 ]; then
            echo "SCAN_COMPLETED_WITH_FINDINGS" > "$CLANG_STATUS_FILE"
          else
            echo "SCAN_COMPLETED_NO_FINDINGS" > "$CLANG_STATUS_FILE"
          fi
        fi

    - name: Show Cppcheck XML report
      shell: bash
      run: |
        echo "===== Cppcheck XML Report ====="
        cat reports/cppcheck-report.xml || true

    - name: List Clang report files
      shell: bash
      run: |
        echo "===== Clang Static Analyzer Report Files ====="
        find reports/clang-report -type f || true

    - name: Run ML1 commit risk prediction
      shell: bash
      env:
        ML1_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        ML1_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      run: |
        python3 "$GITHUB_ACTION_PATH/ml/commit_risk/commit_risk_predictor.py" \
          --scan-path "${{ inputs.scan-path }}" \
          --model-path "$GITHUB_ACTION_PATH/models/commit_risk/commit_risk_model.pkl" \
          --vectorizer-path "$GITHUB_ACTION_PATH/models/commit_risk/tfidf_vectorizer.pkl" \
          --high-threshold "${{ inputs.ml1-high-threshold }}" \
          --medium-threshold "${{ inputs.ml1-medium-threshold }}" \
          --review-confidence-threshold "${{ inputs.ml1-review-confidence-threshold }}" \
          --commit-sha "${{ github.sha }}" \
          --branch "${{ github.ref_name }}" \
          --event-type "${{ github.event_name }}" \
          --author "${{ github.actor }}" \
          --base-ref "$ML1_BASE_SHA" \
          --head-ref "$ML1_HEAD_SHA" \
          --output "reports/commit_risk/commit_risk_report.csv"

    - name: Run ML2 Cppcheck alert prioritisation
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/ml/alert_prioritizer/cppcheck/cppcheck_prioritizer.py"

    - name: Run ML2 Clang alert prioritisation
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/ml/alert_prioritizer/clang/clang_prioritizer.py"

    - name: Restore ML3 state from dedicated state branch
      shell: bash
      env:
        ML3_STATE_BRANCH: ${{ inputs.ml3-state-branch }}
      run: |
        set -euo pipefail
        mkdir -p .devsecops/anomaly_detection/models

        if git ls-remote --exit-code --heads origin "$ML3_STATE_BRANCH" >/dev/null 2>&1; then
          git fetch --no-tags origin "$ML3_STATE_BRANCH"

          for state_path in \
            .devsecops/anomaly_detection/pipeline_metrics.csv \
            .devsecops/anomaly_detection/models/anomaly_model.pkl \
            .devsecops/anomaly_detection/models/anomaly_model_metadata.json; do
            if git cat-file -e "origin/$ML3_STATE_BRANCH:$state_path" 2>/dev/null; then
              mkdir -p "$(dirname "$state_path")"
              git show "origin/$ML3_STATE_BRANCH:$state_path" > "$state_path"
            fi
          done
        else
          echo "ML3 state branch '$ML3_STATE_BRANCH' does not exist yet. Bootstrap mode."
        fi

    - name: Collect ML3 pipeline metrics
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/ml/anomaly_detection/pipeline_metrics_collector.py"

    - name: Run ML3 orchestration (inference before append and training)
      shell: bash
      env:
        ML3_MINIMUM_HISTORY: ${{ inputs.ml3-minimum-history }}
        ML3_RETRAINING_INTERVAL: ${{ inputs.ml3-retraining-interval }}
        ML3_CONTAMINATION: ${{ inputs.ml3-contamination }}
      run: |
        python3 "$GITHUB_ACTION_PATH/ml/anomaly_detection/ml3_orchestrator.py"

    - name: Persist ML3 state to dedicated state branch
      shell: bash
      continue-on-error: true
      env:
        ML3_STATE_BRANCH: ${{ inputs.ml3-state-branch }}
      run: |
        set -euo pipefail

        if [ ! -f reports/anomaly_detection/anomaly_report.csv ]; then
          echo "No ML3 anomaly report produced; skipping state persistence."
          exit 0
        fi

        SHOULD_PERSIST=$(python3 - <<'PY'
import pandas as pd
from pathlib import Path

report_file = Path("reports/anomaly_detection/anomaly_report.csv")
if not report_file.exists():
    print("false")
    raise SystemExit(0)

df = pd.read_csv(report_file)
if df.empty:
    print("false")
    raise SystemExit(0)

row = df.iloc[0]
print("true" if bool(row.get("state_persistence_required", False)) else "false")
PY
        )

        if [ "$SHOULD_PERSIST" != "true" ]; then
          echo "ML3 state persistence not required for this execution context."
          exit 0
        fi

        for required in \
          .devsecops/anomaly_detection/pipeline_metrics.csv \
          .devsecops/anomaly_detection/models/anomaly_model.pkl \
          .devsecops/anomaly_detection/models/anomaly_model_metadata.json; do
          if [ ! -f "$required" ]; then
            echo "Required ML3 state file missing: $required"
            python3 - <<'PY'
import pandas as pd
from pathlib import Path

report_file = Path("reports/anomaly_detection/anomaly_report.csv")
if report_file.exists():
    df = pd.read_csv(report_file)
    if not df.empty:
        df.loc[0, "anomaly_status"] = "FAILED"
        df.loc[0, "reason"] = "ML3 state persistence failed"
        df.loc[0, "failure_reason"] = "STATE_FILE_MISSING"
        df.to_csv(report_file, index=False)
PY
            exit 1
          fi
        done

        STATE_WORKTREE="$(mktemp -d)"
        cleanup() {
          git worktree remove "$STATE_WORKTREE" --force >/dev/null 2>&1 || true
          rm -rf "$STATE_WORKTREE" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        if git ls-remote --exit-code --heads origin "$ML3_STATE_BRANCH" >/dev/null 2>&1; then
          git fetch --no-tags origin "$ML3_STATE_BRANCH"
          git worktree add "$STATE_WORKTREE" "origin/$ML3_STATE_BRANCH"
        else
          git worktree add --detach "$STATE_WORKTREE"
          (
            cd "$STATE_WORKTREE"
            git checkout --orphan "$ML3_STATE_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          )
        fi

        mkdir -p "$STATE_WORKTREE/.devsecops/anomaly_detection/models"
        cp -f .devsecops/anomaly_detection/pipeline_metrics.csv "$STATE_WORKTREE/.devsecops/anomaly_detection/pipeline_metrics.csv"
        cp -f .devsecops/anomaly_detection/models/anomaly_model.pkl "$STATE_WORKTREE/.devsecops/anomaly_detection/models/anomaly_model.pkl"
        cp -f .devsecops/anomaly_detection/models/anomaly_model_metadata.json "$STATE_WORKTREE/.devsecops/anomaly_detection/models/anomaly_model_metadata.json"

        (
          cd "$STATE_WORKTREE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .devsecops/anomaly_detection/pipeline_metrics.csv
          git add .devsecops/anomaly_detection/models/anomaly_model.pkl
          git add .devsecops/anomaly_detection/models/anomaly_model_metadata.json

          if git diff --cached --quiet; then
            echo "No ML3 state changes to persist."
            exit 0
          fi

          git commit -m "chore(ml3): update anomaly detection state"
          git push origin "HEAD:$ML3_STATE_BRANCH"
        )

        echo "ML3 state persisted to branch '$ML3_STATE_BRANCH'."

    - name: Run final security decision engine
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/ml/decision_engine/security_decision_engine.py"

    - name: Upload Cppcheck XML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cppcheck-xml-report
        path: reports/cppcheck-report.xml
        if-no-files-found: ignore

    - name: Upload Clang analyzer console output
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: clang-console-output
        path: reports/clang-output.txt
        if-no-files-found: ignore

    - name: Upload Clang Static Analyzer report folder
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: clang-static-analyzer-report
        path: reports/clang-report
        if-no-files-found: ignore

    - name: Upload commit risk report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: commit-risk-report
        path: reports/commit_risk/commit_risk_report.csv
        if-no-files-found: ignore

    - name: Upload commit risk summary report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: commit-risk-summary-report
        path: reports/commit_risk/commit_risk_summary.csv
        if-no-files-found: ignore

    - name: Upload Cppcheck prioritised alerts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cppcheck-prioritised-alerts
        path: reports/alert_prioritizer/cppcheck/prioritised-alerts.csv
        if-no-files-found: ignore

    - name: Upload Clang prioritised alerts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: clang-prioritised-alerts
        path: reports/alert_prioritizer/clang/prioritised-alerts.csv
        if-no-files-found: ignore

    - name: Upload anomaly detection metrics
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: anomaly-detection-metrics
        path: reports/anomaly_detection/current_pipeline_metrics.csv
        if-no-files-found: ignore

    - name: Upload ML3 anomaly report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ml3-anomaly-report
        path: reports/anomaly_detection/anomaly_report.csv
        if-no-files-found: ignore

    - name: Upload final security decision
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: final-security-decision
        path: reports/final_decision/security_decision.csv
        if-no-files-found: ignore
